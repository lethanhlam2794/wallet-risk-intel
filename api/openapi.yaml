openapi: 3.1.0
info:
  title: Blockchain Wallet Risk Intelligence API
  version: "0.2.0"
  description: |
    REST API for wallet risk signals over published OFAC SDN sanctions data,
    public attribution labels, and live third-party enrichment.

    Implemented scope (spec §19 phases 1–4): network catalog, wallet
    normalization, sanctions wallet/entity/program lookups, public
    attribution labels, live multi-provider wallet enrichment, admin
    ingestion, health probes, and metrics. Later-phase endpoints
    (screenings, tracing) are intentionally absent.

    **Semantics**: a non-match is data, never a safety verdict. `matched:false`
    means "no listing on this network in the current snapshot" — see
    `cross_chain_observations` and `unresolved_network_listings` for listings
    of the same address that cannot count as a direct match. Provider
    observations are `reported` — never auto-verified — and provider
    failures surface as typed statuses, never as clean results.
  contact:
    name: Engineering
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: system
  - name: reference
  - name: wallets
  - name: sanctions
  - name: admin

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { "status": "ok" }

  /readyz:
    get:
      tags: [system]
      summary: Readiness probe (Postgres + Redis)
      security: []
      responses:
        "200":
          description: All dependencies reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
              example: { "postgres": "ok", "redis": "ok" }
        "503":
          description: At least one dependency is down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
              example: { "postgres": "ok", "redis": "down" }

  /metrics:
    get:
      tags: [system]
      summary: Prometheus scrape endpoint
      description: Requires a reader or admin API key.
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/networks:
    get:
      tags: [reference]
      summary: List supported blockchain networks
      responses:
        "200":
          description: Active networks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Network" }
              example:
                data:
                  - { code: ethereum, name: Ethereum, chain_id: "eip155:1", namespace: eip155 }
                  - { code: bsc, name: BNB Smart Chain, chain_id: "eip155:56", namespace: eip155 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/wallets/{network}/{address}:
    get:
      tags: [wallets]
      summary: Get-or-create a wallet record
      description: |
        Normalizes the address (EIP-55/hex), resolves the network, and
        returns the wallet with freshness metadata. `labels` carries the
        first five active public-label summaries; `data_status` here stays
        **sanctions**-scoped — label freshness is reported by the labels
        endpoint below.
      parameters:
        - { $ref: "#/components/parameters/Network" }
        - { $ref: "#/components/parameters/Address" }
      responses:
        "200":
          description: Wallet record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Wallet" }
              example:
                data:
                  network: ethereum
                  address: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"
                  normalized_address: "0x098b716b8aaf21512996dc57eb0615e2383e2f96"
                  address_type: evm
                  labels: []
                  labels_count: 0
                  data_status: AVAILABLE
                  last_synced_at: "2026-10-28T12:00:00Z"
                  first_seen_at: "2026-10-28T12:00:01Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/wallets/{network}/{address}/labels:
    get:
      tags: [wallets]
      summary: Public attribution labels for a wallet
      description: |
        Lists public wallet labels (upstream attribution dataset —
        prettydeath/wallet-attribution, MIT license). Labels are community/
        provider attributions, `reported` never auto-verified; GAMBLING and
        EXCHANGE are classifications, not risk verdicts; an empty `labels`
        array is "no data", **not** "safe".

        - `labels_count` is the total number of rows matching the active
          filters, not the page size.
        - `data_status`/`last_synced_at` reflect the latest published
          wallet-attribution snapshot and are recomputed per response
          (never served from cache): `UNAVAILABLE` means no snapshot has
          been published yet.
        - Revoked labels are hidden unless `active_only=false`.
      parameters:
        - { $ref: "#/components/parameters/Network" }
        - { $ref: "#/components/parameters/Address" }
        - name: category
          in: query
          schema: { type: string }
          description: Filter by normalized category code (e.g. `EXCHANGE`,
            `SCAM`); an upstream string resolves to the same code.
        - name: source
          in: query
          schema: { type: string }
          description: Filter by data source code (e.g. `wallet_attribution`).
        - name: source_field
          in: query
          schema: { type: string }
          description: Substring match on the upstream `source` vocabulary
            inside evidence (e.g. `forta`, `eth-labels`).
        - name: verification_status
          in: query
          schema: { type: string, enum: [reported, unverified, verified, disputed] }
        - name: active_only
          in: query
          schema: { type: boolean, default: true }
          description: When false, soft-revoked labels are included with
            their `revoked_at` timestamp.
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque base64 cursor from a previous `next_cursor`.
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200, minimum: 1 }
      responses:
        "200":
          description: Label page plus freshness metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/LabelPage" }
              examples:
                labeled:
                  summary: Labeled wallet
                  value:
                    data:
                      network: ethereum
                      address: "0x00000000000000000000000000000000000000a1"
                      normalized_address: "0x00000000000000000000000000000000000000a1"
                      labels:
                        - wallet_label_id: 42
                          category: EXCHANGE
                          category_type: ENTITY_TYPE
                          label: "Binance: Hot Wallet"
                          entity: { id: 7, name: Binance }
                          source: { code: wallet_attribution, name: "Wallet Attribution (prettydeath)" }
                          source_field: "eth-labels+cex-list"
                          source_url: "https://example.com"
                          upstream_category: exchange
                          confidence: high
                          verification_status: reported
                          evidence:
                            source_field: "eth-labels+cex-list"
                            upstream_record: { label: "Binance: Hot Wallet", entity: Binance }
                            fetch_checksum_part: "ab12cd34ef56…"
                            observed_at: "2026-10-01T00:00:00Z"
                          observed_at: "2026-10-01T00:00:00Z"
                          first_seen_at: "2026-11-03T12:00:00Z"
                          last_seen_at: "2026-11-03T12:00:00Z"
                          revoked_at: null
                      labels_count: 1
                      next_cursor: ""
                      data_status: AVAILABLE
                      last_synced_at: "2026-11-03T12:00:00Z"
                revoked:
                  summary: Revoked label (active_only=false)
                  value:
                    data:
                      network: ethereum
                      address: "0x00000000000000000000000000000000000000a5"
                      normalized_address: "0x00000000000000000000000000000000000000a5"
                      labels:
                        - wallet_label_id: 46
                          category: HACK
                          category_type: MALICIOUS_ACTIVITY
                          label: "Null Entity Label"
                          entity: { id: 9, name: "Null" }
                          source: { code: wallet_attribution, name: "Wallet Attribution (prettydeath)" }
                          source_field: forta
                          source_url: "https://example.com"
                          upstream_category: hack
                          confidence: high
                          verification_status: reported
                          evidence: {}
                          observed_at: "2026-10-01T00:00:00Z"
                          first_seen_at: "2026-11-03T12:00:00Z"
                          last_seen_at: "2026-11-04T12:00:00Z"
                          revoked_at: "2026-11-04T12:00:00Z"
                      labels_count: 1
                      next_cursor: ""
                      data_status: AVAILABLE
                      last_synced_at: "2026-11-04T12:00:00Z"
                unlabeled:
                  summary: Unlabeled wallet (no data — not a verdict)
                  value:
                    data:
                      network: ethereum
                      address: "0x00000000000000000000000000000000deadbeef"
                      normalized_address: "0x00000000000000000000000000000000deadbeef"
                      labels: []
                      labels_count: 0
                      next_cursor: ""
                      data_status: AVAILABLE
                      last_synced_at: "2026-11-03T12:00:00Z"
        "400":
          description: Invalid address/network/filters or malformed cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                invalidCursor:
                  value:
                    error:
                      code: INVALID_CURSOR
                      message: invalid cursor
                      request_id: "req_123"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/wallets/{network}/{address}/enrichment:
    get:
      tags: [wallets]
      summary: Live multi-provider enrichment for a wallet
      description: |
        Fans out to the registered live providers (GoPlus, PublicAML,
        Chainabuse) with cache-first semantics and returns per-provider
        observations, signals, provider scores, and indirect exposures.

        **Semantics — read before consuming:**

        - `provider_score` is the **provider's own** score (e.g. PublicAML
          `aml_score`); it is never the internal risk score and not ground
          truth. A score of `0` is data, **not** a safe verdict —
          especially under a non-`OK` provider status.
        - `status` aggregates per-provider outcomes: `COMPLETED` when every
          attempted provider succeeded, `PARTIAL` on a mix, `FAILED` when
          every attempted provider failed, `INSUFFICIENT_DATA` when nothing
          was attempted (e.g. all disabled).
        - Per-provider `status` uses the persisted vocabulary: `OK`,
          `DEGRADED`, `RATE_LIMITED`, `TIMEOUT`, `UPSTREAM_5XX`,
          `CLIENT_4XX`, `MALFORMED`, `CIRCUIT_OPEN`, `DISABLED`,
          `TRANSPORT`, `ERROR`. `DISABLED` means the provider is configured
          off (e.g. no API key) and made **zero** outbound calls — it does
          not count as attempted.
        - `error.retry_after` is expressed in **seconds** (integer), carried
          through from the upstream `Retry-After` hint.
        - `cached:true` marks a response served from the provider cache;
          `cache_expires_at` states when the cached entry expires (UTC).
          Positive entries live 15 minutes; negative/degraded entries live
          60 seconds and can never replay as clean (their `status` is
          embedded in the cached payload). `cache:"bypassed"` marks a
          Redis outage — the endpoint fails open rather than failing.
        - `persisted` reports whether the fetch that produced this result
          wrote a `provider_observations` audit row — on a `cached:true`
          hit it reflects the original fetch's outcome, not this request.
          Persistence failures never alter provider status.
        - `observations[]` are normalized risk signals — all
          `reported`/`unverified`, never auto-verified. `exposures[]` are
          indirect graph-derived exposures, kept strictly separate: a graph
          path never implies ownership or direct attribution.
        - `refresh` parses via `strconv.ParseBool`. When true it bypasses
          the cache read (still writes through) **but is quota-guarded**:
          one bypass per (source, network, address) per 60 s cooldown —
          inside the cooldown the flag behaves as a normal request. A cache
          miss always fetches regardless of the flag.
        - Provider `Authorization` headers are never logged (spec §16).
      parameters:
        - { $ref: "#/components/parameters/Network" }
        - { $ref: "#/components/parameters/Address" }
        - name: refresh
          in: query
          schema: { type: boolean, default: false }
          description: Bypass the cache read when the per-key cooldown
            allows it (see description above).
        - name: providers
          in: query
          schema: { type: string }
          description: Comma-separated provider subset (e.g.
            `goplus,publicaml`). Empty or absent means every registered
            provider; an unknown name returns `400 BAD_REQUEST`.
      responses:
        "200":
          description: Enrichment result — check per-provider statuses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EnrichmentResult" }
              example:
                data:
                  network: ethereum
                  address: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"
                  normalized_address: "0x098b716b8aaf21512996dc57eb0615e2383e2f96"
                  status: PARTIAL
                  providers:
                    - source: goplus
                      enabled: true
                      status: OK
                      cached: false
                      fetched_at: "2026-11-03T12:00:01Z"
                      cache_expires_at: "2026-11-03T12:15:01Z"
                      http_status: 200
                      latency_ms: 340
                      persisted: true
                      observations:
                        - category: SANCTIONED
                          label: sanctioned
                          entity: ""
                          source_url: ""
                          confidence: unknown
                          verification_status: reported
                          observed_at: "2026-11-03T12:00:01Z"
                          evidence:
                            { "field": "sanctioned", "value": "1",
                              "data_source": "SlowMist,BlockSec" }
                      signals: { data_source: "SlowMist,BlockSec" }
                      exposures: []
                    - source: publicaml
                      enabled: true
                      status: OK
                      cached: false
                      fetched_at: "2026-11-03T12:00:02Z"
                      cache_expires_at: "2026-11-03T12:15:02Z"
                      http_status: 200
                      latency_ms: 812
                      persisted: true
                      provider_score: 100.0
                      observations:
                        - category: SANCTIONED
                          label: sanction
                          entity: "Lazarus Group"
                          confidence: unknown
                          verification_status: reported
                          observed_at: "2026-11-03T12:00:02Z"
                          evidence:
                            category: sanction
                            score: 100.0
                            source: "ofac:sdn_advanced"
                      signals:
                        label: "Lazarus Group"
                        category: sanction
                        sanctioned: true
                      exposures:
                        - counterparty: "0x35fb6f6db4fb05e6a4ce86f2c93691425626d4b1"
                          category: sanction
                          hops: 1
                          score: 90.0
                          direction: outbound
                    - source: chainabuse
                      enabled: false
                      status: DISABLED
                      cached: false
                      persisted: false
                      error:
                        code: disabled
                        message: "provider not enabled — no outbound call made"
                      observations: []
                      signals: {}
                      exposures: []
                  enriched_at: "2026-11-03T12:00:03Z"
        "400":
          description: Invalid network/address, malformed `refresh`, or
            unknown provider in `providers`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: BAD_REQUEST
                  message: unknown provider in providers filter
                  request_id: "req_123"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/sanctions/wallets/{network}/{address}:
    get:
      tags: [sanctions]
      summary: Sanctions listing lookup for a wallet
      description: |
        Exact match requires the normalized address to be listed on the
        resolved network in the current published snapshot.

        - `sanctions[]` — deduplicated by `sanctions_entity_id`.
        - `cross_chain_observations[]` — same address evidenced on a
          *different* network; never counted in `matched`.
        - `unresolved_network_listings[]` — same address listed with no
          resolvable network (`network_id IS NULL`); always surfaced so a
          listed address can never read as "no data".
        - `reason.summary` is only populated from official source text;
          it is `null` otherwise — reasons are never synthesized.
      parameters:
        - { $ref: "#/components/parameters/Network" }
        - { $ref: "#/components/parameters/Address" }
      responses:
        "200":
          description: Lookup result (match or non-match — both are data).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WalletSanctionsLookup" }
              examples:
                matched:
                  summary: Address listed on the queried network
                  value:
                    data:
                      network: ethereum
                      address: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"
                      normalized_address: "0x098b716b8aaf21512996dc57eb0615e2383e2f96"
                      matched: true
                      match_type: WALLET_EXACT
                      match_scope: CHAIN_SPECIFIC
                      sanctions:
                        - sanctions_entity_id: 1
                          external_entity_id: "31940"
                          entity_name: LAZARUS GROUP
                          entity_type: Entity
                          listed_address: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"
                          currency_code: ETH
                          identifier_type: "Digital Currency Address - ETH"
                          match_scope: CHAIN_SPECIFIC
                          programs:
                            - { code: CYBER2, name: null, description: null, source_url: null }
                            - { code: DPRK3, name: null, description: null, source_url: null }
                          reason: { summary: null, status: PROGRAM_CONTEXT_ONLY }
                          source: { code: ofac_sdn, name: "OFAC SDN Advanced XML", url: null }
                      cross_chain_observations: []
                      unresolved_network_listings:
                        - network_code: null
                          currency_code: USDT
                          listed_address: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"
                          sanctions_entity_id: 1
                          entity_name: LAZARUS GROUP
                          match_scope: UNRESOLVED
                          identifier_type: "Digital Currency Address - USDT"
                          source_code: ofac_sdn
                      data_status: AVAILABLE
                      last_synced_at: "2026-10-28T12:00:00Z"
                non_match:
                  summary: Address not listed on the queried network
                  value:
                    data:
                      network: bsc
                      address: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"
                      normalized_address: "0x098b716b8aaf21512996dc57eb0615e2383e2f96"
                      matched: false
                      match_type: null
                      match_scope: null
                      sanctions: []
                      cross_chain_observations:
                        - network_code: ethereum
                          currency_code: ETH
                          listed_address: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"
                          sanctions_entity_id: 1
                          entity_name: LAZARUS GROUP
                          match_scope: CHAIN_SPECIFIC
                          identifier_type: "Digital Currency Address - ETH"
                          source_code: ofac_sdn
                      unresolved_network_listings:
                        - network_code: null
                          currency_code: USDT
                          listed_address: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"
                          sanctions_entity_id: 1
                          entity_name: LAZARUS GROUP
                          match_scope: UNRESOLVED
                          identifier_type: "Digital Currency Address - USDT"
                          source_code: ofac_sdn
                      data_status: AVAILABLE
                      last_synced_at: "2026-10-28T12:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/sanctions/entities/{id}:
    get:
      tags: [sanctions]
      summary: Sanctions entity detail
      description: "`{id}` is the internal `sanctions_entities.id` primary key; `external_entity_id` (the OFAC `Profile@ID`) is returned in the body."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Entity detail with programs, listings, references.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EntityDetail" }
              example:
                data:
                  sanctions_entity_id: 1
                  external_entity_id: "31940"
                  entity_name: LAZARUS GROUP
                  entity_type: Entity
                  source_url: null
                  revoked: false
                  programs:
                    - { code: CYBER2, name: null, description: null, source_url: null }
                    - { code: DPRK3, name: null, description: null, source_url: null }
                  reason: { summary: null, status: PROGRAM_CONTEXT_ONLY }
                  digital_currency_addresses:
                    - listed_address: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"
                      normalized_address: "0x098b716b8aaf21512996dc57eb0615e2383e2f96"
                      currency_code: ETH
                      network_id: 1
                      identifier_type: "Digital Currency Address - ETH"
                      source_identifier_id: "40577"
                      match_scope: CHAIN_SPECIFIC
                      revoked: false
                  official_references: []
                  details: {}
                  source: { code: ofac_sdn, name: "OFAC SDN Advanced XML", url: "https://ofac.treasury.gov/" }
                  last_synced_at: "2026-10-28T12:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sanctions/programs/{code}:
    get:
      tags: [sanctions]
      summary: Sanctions program detail
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, example: DPRK3 }
      responses:
        "200":
          description: Program detail with live entity count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ProgramDetail" }
              example:
                data:
                  code: DPRK3
                  name: null
                  description: null
                  source_url: null
                  source_code: ofac_sdn
                  associated_entities_count: 2
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/ingestion-runs:
    post:
      tags: [admin]
      summary: Trigger an ingestion run (async)
      description: |
        Starts a snapshot ingestion for the given source. Exactly one run
        per source may be in flight: a second trigger while one runs
        returns `409 INGESTION_RUNNING`. The run executes asynchronously;
        poll `GET /api/v1/admin/ingestion-runs/{id}` for status.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string, example: ofac_sdn }
            example: { source: ofac_sdn }
      responses:
        "202":
          description: Run accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      run_id: { type: string, format: uuid }
                      status: { type: string, enum: [RUNNING] }
                      source: { type: string }
              example:
                data:
                  run_id: "7d0f6a1e-2b3c-4d5e-8f9a-0b1c2d3e4f5a"
                  status: RUNNING
                  source: ofac_sdn
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An ingestion run is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: INGESTION_RUNNING, message: "an ingestion run is already in progress", request_id: "req_..." }

  /api/v1/admin/ingestion-runs/{id}:
    get:
      tags: [admin]
      summary: Ingestion run status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Run record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/IngestionRun" }
              example:
                data:
                  run_id: "7d0f6a1e-2b3c-4d5e-8f9a-0b1c2d3e4f5a"
                  source_id: 1
                  status: COMPLETED
                  started_at: "2026-10-28T11:59:00Z"
                  completed_at: "2026-10-28T12:00:00Z"
                  records_fetched: 19500
                  records_inserted: 19500
                  records_updated: 19480
                  records_rejected: 0
                  triggered_by: bootstrap-admin
                  snapshot_checksum: "ab12cd34..."
                  snapshot_version: "ofac-ab12cd34ef56-1730126400"
                  error_message: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    Network:
      name: network
      in: path
      required: true
      description: Network code.
      schema: { type: string, enum: [ethereum, bsc] }
    Address:
      name: address
      in: path
      required: true
      description: EVM address (20-byte hex, 0x prefix optional).
      schema:
        type: string
        pattern: "^(0x)?[0-9a-fA-F]{40}$"
        example: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"

  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string, enum: [ok] }
    ReadyStatus:
      type: object
      properties:
        postgres: { type: string, enum: [ok, down] }
        redis: { type: string, enum: [ok, down] }
    Network:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        chain_id: { type: string, description: "CAIP-2 identifier" }
        namespace: { type: string }
    Wallet:
      type: object
      properties:
        network: { type: string }
        address: { type: string }
        normalized_address: { type: string }
        address_type: { type: string }
        labels:
          type: array
          items: { $ref: "#/components/schemas/LabelSummary" }
          description: First five active public-label summaries.
        labels_count:
          type: integer
          description: Total active labels for the wallet (all sources).
        data_status: { $ref: "#/components/schemas/DataStatus" }
        last_synced_at: { type: ["string", "null"], format: date-time }
        first_seen_at: { type: string, format: date-time }
    DataStatus:
      type: string
      enum: [AVAILABLE, STALE, UNAVAILABLE]
      description: Snapshot freshness recomputed at serve time.
    LabelSummary:
      type: object
      properties:
        wallet_label_id: { type: integer }
        category: { type: string, description: Normalized category code }
        category_type:
          type: string
          enum: [LEGAL, MALICIOUS_ACTIVITY, SERVICE_TYPE, ENTITY_TYPE, OTHER]
        label: { type: string }
        entity:
          type: ["object", "null"]
          properties:
            id: { type: integer }
            name: { type: string }
        confidence: { type: string, enum: [unknown, low, medium, high] }
        verification_status:
          type: string
          enum: [unverified, reported, verified, disputed]
    Label:
      allOf:
        - $ref: "#/components/schemas/LabelSummary"
        - type: object
          properties:
            source:
              type: object
              properties:
                code: { type: string }
                name: { type: string }
            source_field:
              type: string
              description: Upstream `source` vocabulary (e.g. eth-labels+cex-list).
            source_url: { type: ["string", "null"] }
            upstream_category: { type: ["string", "null"] }
            evidence:
              type: object
              description: Provenance payload — upstream_record, source_field,
                fetch_checksum_part, observed_at/date_unparsed.
            observed_at: { type: ["string", "null"], format: date-time }
            first_seen_at: { type: ["string", "null"], format: date-time }
            last_seen_at: { type: ["string", "null"], format: date-time }
            revoked_at: { type: ["string", "null"], format: date-time }
    LabelPage:
      type: object
      properties:
        network: { type: string }
        address: { type: string }
        normalized_address: { type: string }
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        labels_count:
          type: integer
          description: Total rows matching the active filters (not page size).
        next_cursor:
          type: string
          description: Opaque base64 cursor for the next page; empty when done.
        data_status: { $ref: "#/components/schemas/DataStatus" }
        last_synced_at: { type: ["string", "null"], format: date-time }
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
    Reason:
      type: object
      properties:
        summary:
          type: ["string", "null"]
          description: Only populated from official source text; never synthesized.
        status:
          type: string
          enum: [OFFICIAL_EXPLICIT, PROGRAM_CONTEXT_ONLY, NOT_AVAILABLE]
    ProgramRef:
      type: object
      properties:
        code: { type: string }
        name: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        source_url: { type: ["string", "null"], format: uri }
        revoked:
          type: boolean
          description: Link absent from the latest snapshot — provenance only, never a live association.
    SourceRef:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        url: { type: ["string", "null"], format: uri }
    SanctionEntry:
      type: object
      properties:
        sanctions_entity_id: { type: integer }
        external_entity_id: { type: string }
        entity_name: { type: string }
        entity_type: { type: ["string", "null"] }
        listed_address: { type: string }
        currency_code: { type: ["string", "null"] }
        identifier_type: { type: string }
        match_scope: { type: string, enum: [CHAIN_SPECIFIC, UNRESOLVED] }
        programs:
          type: array
          items: { $ref: "#/components/schemas/ProgramRef" }
        reason: { $ref: "#/components/schemas/Reason" }
        source: { $ref: "#/components/schemas/SourceRef" }
    Observation:
      type: object
      description: A listing of the same address that cannot count as a direct match.
      properties:
        network_code: { type: ["string", "null"] }
        currency_code: { type: ["string", "null"] }
        listed_address: { type: string }
        sanctions_entity_id: { type: integer }
        entity_name: { type: string }
        match_scope: { type: string }
        identifier_type: { type: string }
        source_code: { type: string }
    EnrichmentResult:
      type: object
      description: |
        Live multi-provider enrichment. `status` aggregates per-provider
        outcomes; every provider block keeps its own typed status — a
        failure is never hidden inside a verdict and `provider_score` is
        never the internal risk score.
      properties:
        network: { type: string }
        address: { type: string }
        normalized_address: { type: string }
        status:
          type: string
          enum: [COMPLETED, PARTIAL, FAILED, INSUFFICIENT_DATA]
        providers:
          type: array
          items: { $ref: "#/components/schemas/EnrichmentProvider" }
        enriched_at: { type: string, format: date-time }
    EnrichmentProvider:
      type: object
      properties:
        source: { type: string, enum: [goplus, publicaml, chainabuse] }
        enabled: { type: boolean }
        status:
          type: string
          enum: [OK, DEGRADED, RATE_LIMITED, TIMEOUT, UPSTREAM_5XX,
                 CLIENT_4XX, MALFORMED, CIRCUIT_OPEN, DISABLED, TRANSPORT, ERROR]
        cached: { type: boolean }
        cache:
          type: string
          enum: [bypassed]
          description: Present only when Redis was unreachable (fail-open).
        fetched_at: { type: string, format: date-time }
        cache_expires_at: { type: string, format: date-time }
        http_status: { type: integer }
        latency_ms: { type: integer }
        persisted: { type: boolean }
        error: { $ref: "#/components/schemas/ProviderError" }
        provider_score:
          type: number
          description: The provider's own score — never the internal risk
            score; 0 is data, not a safe verdict.
        observations:
          type: array
          items: { $ref: "#/components/schemas/EnrichmentObservation" }
        signals:
          type: object
          additionalProperties: true
          description: Provider-native fields kept verbatim; always `{}` when empty.
        exposures:
          type: array
          items: { $ref: "#/components/schemas/EnrichmentExposure" }
    ProviderError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        retry_after:
          type: integer
          description: Upstream Retry-After hint in seconds.
    EnrichmentObservation:
      type: object
      description: One normalized provider signal — reported, never auto-verified.
      properties:
        category: { type: string }
        label: { type: string }
        entity: { type: string }
        source_url: { type: string }
        confidence: { type: string }
        verification_status: { type: string, enum: [reported, unverified] }
        observed_at: { type: string, format: date-time }
        evidence: { type: object, additionalProperties: true }
    EnrichmentExposure:
      type: object
      description: Indirect graph-derived exposure — never direct attribution.
      properties:
        counterparty: { type: string }
        category: { type: string }
        hops: { type: integer }
        score: { type: number }
        direction: { type: string, enum: [outbound, inbound, mixed] }
    WalletSanctionsLookup:
      type: object
      properties:
        network: { type: string }
        address: { type: string }
        normalized_address: { type: string }
        matched: { type: boolean }
        match_type: { type: ["string", "null"], enum: [WALLET_EXACT, null] }
        match_scope: { type: ["string", "null"], enum: [CHAIN_SPECIFIC, null] }
        sanctions:
          type: array
          items: { $ref: "#/components/schemas/SanctionEntry" }
        cross_chain_observations:
          type: array
          items: { $ref: "#/components/schemas/Observation" }
        unresolved_network_listings:
          type: array
          items: { $ref: "#/components/schemas/Observation" }
        data_status: { $ref: "#/components/schemas/DataStatus" }
        last_synced_at: { type: ["string", "null"], format: date-time }
    EntityAddress:
      type: object
      properties:
        listed_address: { type: string }
        normalized_address: { type: string }
        currency_code: { type: ["string", "null"] }
        network_id: { type: ["integer", "null"] }
        identifier_type: { type: string }
        source_identifier_id: { type: ["string", "null"] }
        match_scope: { type: string }
        revoked: { type: boolean }
    EntityReference:
      type: object
      properties:
        reference_type: { type: string }
        title: { type: ["string", "null"] }
        reference_url: { type: ["string", "null"], format: uri }
        published_at: { type: ["string", "null"], format: date-time }
        revoked:
          type: boolean
          description: Reference absent from the latest snapshot — retained for audit (spec §6).
    EntityDetail:
      type: object
      properties:
        sanctions_entity_id: { type: integer }
        external_entity_id: { type: string }
        entity_name: { type: string }
        entity_type: { type: ["string", "null"] }
        source_url: { type: ["string", "null"], format: uri }
        revoked: { type: boolean }
        programs:
          type: array
          items: { $ref: "#/components/schemas/ProgramRef" }
        reason: { $ref: "#/components/schemas/Reason" }
        digital_currency_addresses:
          type: array
          items: { $ref: "#/components/schemas/EntityAddress" }
        official_references:
          type: array
          items: { $ref: "#/components/schemas/EntityReference" }
        details: { type: object }
        source: { $ref: "#/components/schemas/SourceRef" }
        data_status: { $ref: "#/components/schemas/DataStatus" }
        last_synced_at: { type: ["string", "null"], format: date-time }
    ProgramDetail:
      type: object
      properties:
        code: { type: string }
        name: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        source_url: { type: ["string", "null"], format: uri }
        source_code: { type: string }
        associated_entities_count: { type: integer }
        data_status: { $ref: "#/components/schemas/DataStatus" }
        last_synced_at: { type: ["string", "null"], format: date-time }
    IngestionRun:
      type: object
      properties:
        run_id: { type: string, format: uuid }
        source_id: { type: integer }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        started_at: { type: string, format: date-time }
        completed_at: { type: ["string", "null"], format: date-time }
        records_fetched: { type: integer }
        records_inserted: { type: integer }
        records_updated: { type: integer }
        records_rejected: { type: integer }
        triggered_by: { type: ["string", "null"] }
        snapshot_checksum: { type: ["string", "null"] }
        snapshot_version: { type: ["string", "null"] }
        error_message: { type: ["string", "null"] }
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: ["string", "null"] }

  responses:
    BadRequest:
      description: Invalid input (unknown network, malformed address, bad id).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: INVALID_ADDRESS, message: "invalid address", request_id: "req_..." }
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: UNAUTHORIZED, message: "valid API key required", request_id: "req_..." }
    Forbidden:
      description: Insufficient role (admin required).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: FORBIDDEN, message: "insufficient role", request_id: "req_..." }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: NOT_FOUND, message: "not found", request_id: "req_..." }
    RateLimited:
      description: Rate limit exceeded; retry after `Retry-After` seconds.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

security:
  - ApiKeyAuth: []
