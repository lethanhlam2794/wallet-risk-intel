# Deploy — push to main builds the api image, pushes to GHCR,
# then SSHes into the VPS to pull + restart the compose stack.
#
# Required GitHub secrets:
#   STAGING_SSH_HOST        VPS hostname/IP
#   STAGING_SSH_USER        SSH user (e.g. ubuntu)
#   STAGING_SSH_PRIVATE_KEY private key contents (ed25519)
#   STAGING_SSH_PORT        optional, default 22
#   GHCR_USERNAME           GitHub username for server-side `docker login ghcr.io`
#   GHCR_TOKEN              PAT with read:packages (private images) — skip if public
#
# Required GitHub vars:
#   STAGING_REMOTE_DIR      optional, default ~/check-wallet
#
# Required on the server (one-time, in $REMOTE_DIR):
#   .env                    filled from apps/api/.env (provider keys, POSTGRES_PASSWORD)

name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REMOTE_DIR: ${{ vars.STAGING_REMOTE_DIR || '~/check-wallet' }}
  SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}

jobs:
  build:
    name: Build & push api image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}-api:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Prune old GHCR images
        uses: actions/delete-package-versions@v5
        if: success()
        continue-on-error: true
        with:
          package-name: 'wallet-risk-intel-api'
          package-type: 'container'
          min-versions-to-keep: 3
          ignore-versions: '^(latest)$'
          token: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy stack to server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_HOST}" || { echo "Missing required secret: STAGING_SSH_HOST"; exit 1; }
          test -n "${SSH_PRIVATE_KEY}" || { echo "Missing required secret: STAGING_SSH_PRIVATE_KEY"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Upload compose file
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "${SSH_USER}" || { echo "Missing required secret: STAGING_SSH_USER"; exit 1; }

          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "REMOTE_DIR='${REMOTE_DIR}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          REMOTE_DIR="${REMOTE_DIR/#\~/$HOME}"
          mkdir -p "${REMOTE_DIR}"
          REMOTE_SCRIPT

          scp -P "${SSH_PORT}" apps/api/docker-compose.prod.yml "${SSH_USER}@${SSH_HOST}:~/docker-compose.prod.yml.tmp"

          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "REMOTE_DIR='${REMOTE_DIR}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          REMOTE_DIR="${REMOTE_DIR/#\~/$HOME}"
          mv ~/docker-compose.prod.yml.tmp "${REMOTE_DIR}/docker-compose.prod.yml"
          REMOTE_SCRIPT

      - name: Deploy containers
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "${GHCR_USERNAME}" || { echo "Missing required secret: GHCR_USERNAME"; exit 1; }
          test -n "${GHCR_TOKEN}" || { echo "Missing required secret: GHCR_TOKEN"; exit 1; }

          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "IMAGE_TAG='${{ github.sha }}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}' REMOTE_DIR='${REMOTE_DIR}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          REMOTE_DIR="${REMOTE_DIR/#\~/$HOME}"
          cd "${REMOTE_DIR}"

          test -f .env || {
            echo ".env missing on server: ${REMOTE_DIR}/.env"
            exit 1
          }
          test -f docker-compose.prod.yml || {
            echo "docker-compose.prod.yml missing"
            exit 1
          }

          echo "Logging in to ghcr.io..."
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

          echo "Pulling image (tag ${IMAGE_TAG})..."
          docker compose --env-file .env -f docker-compose.prod.yml pull

          echo "Running migrations..."
          docker compose --env-file .env -f docker-compose.prod.yml up -d postgres redis
          docker compose --env-file .env -f docker-compose.prod.yml run --rm -T migrate

          echo "Starting stack (postgres + redis + api + worker)..."
          docker compose --env-file .env -f docker-compose.prod.yml up -d

          # Persist the deployed tag so manual `docker compose up -d` resolves
          # ${IMAGE_TAG:-latest} to this release instead of a stale local tag.
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
          else
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
          fi

          echo "Pruning old app images on server (keeping 3 latest versions for rollback)..."
          docker images --format '{{.Repository}}:{{.Tag}}' | \
            grep "wallet-risk-intel-api" | \
            awk '!/:(latest)$/ { count++; if (count > 3) print $0 }' | \
            xargs -r docker rmi 2>/dev/null || true

          docker image prune -f
          REMOTE_SCRIPT
