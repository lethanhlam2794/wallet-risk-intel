openapi: 3.1.0
info:
  title: Blockchain Wallet Risk Intelligence API
  version: "0.3.0"
  description: |
    REST API for wallet risk signals over published OFAC SDN sanctions data,
    public attribution labels, live third-party enrichment, and versioned
    risk scoring.

    Implemented scope (spec §19 phases 1–5): network catalog, wallet
    normalization, sanctions wallet/entity/program lookups, public
    attribution labels, live multi-provider wallet enrichment, synchronous
    risk screenings with claim-first idempotency, admin ingestion, health
    probes, metrics, and bounded transaction indexing/tracing
    (native + fungible-token scope, 1-hop/2-hop BFS).

    **Semantics**: a non-match is data, never a safety verdict. `matched:false`
    means "no listing on this network in the current snapshot" — see
    `cross_chain_observations` and `unresolved_network_listings` for listings
    of the same address that cannot count as a direct match. Provider
    observations are `reported` — never auto-verified — and provider
    failures surface as typed statuses, never as clean results. Screening
    scores are heuristic, versioned (`scoring.policy_version`), and always
    accompanied by `data_completeness` — `LOW` never means "proven safe".
  contact:
    name: Engineering
servers:
  - url: http://localhost:8010
    description: Local development
tags:
  - name: system
  - name: reference
  - name: wallets
  - name: sanctions
  - name: screenings
  - name: admin

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { "status": "ok" }

  /readyz:
    get:
      tags: [system]
      summary: Readiness probe (Postgres + Redis)
      security: []
      responses:
        "200":
          description: All dependencies reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
              example: { "postgres": "ok", "redis": "ok" }
        "503":
          description: At least one dependency is down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
              example: { "postgres": "ok", "redis": "down" }

  /metrics:
    get:
      tags: [system]
      summary: Prometheus scrape endpoint
      description: Requires a reader or admin API key.
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/networks:
    get:
      tags: [reference]
      summary: List supported blockchain networks
      responses:
        "200":
          description: Active networks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Network" }
              example:
                data:
                  - { code: ethereum, name: Ethereum, chain_id: "eip155:1", namespace: eip155 }
                  - { code: bsc, name: BNB Smart Chain, chain_id: "eip155:56", namespace: eip155 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/wallets/{network}/{address}:
    get:
      tags: [wallets]
      summary: Get-or-create a wallet record
      description: |
        Normalizes the address (EIP-55/hex), resolves the network, and
        returns the wallet with freshness metadata. `labels` carries the
        first five active public-label summaries; `data_status` here stays
        **sanctions**-scoped — label freshness is reported by the labels
        endpoint below.
      parameters:
        - { $ref: "#/components/parameters/Network" }
        - { $ref: "#/components/parameters/Address" }
      responses:
        "200":
          description: Wallet record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Wallet" }
              example:
                data:
                  network: ethereum
                  address: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"
                  normalized_address: "0x098b716b8aaf21512996dc57eb0615e2383e2f96"
                  address_type: evm
                  labels: []
                  labels_count: 0
                  data_status: AVAILABLE
                  last_synced_at: "2026-10-28T12:00:00Z"
                  first_seen_at: "2026-10-28T12:00:01Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/wallets/{network}/{address}/labels:
    get:
      tags: [wallets]
      summary: Public attribution labels for a wallet
      description: |
        Lists public wallet labels (upstream attribution dataset —
        prettydeath/wallet-attribution, MIT license). Labels are community/
        provider attributions, `reported` never auto-verified; GAMBLING and
        EXCHANGE are classifications, not risk verdicts; an empty `labels`
        array is "no data", **not** "safe".

        - `labels_count` is the total number of rows matching the active
          filters, not the page size.
        - `data_status`/`last_synced_at` reflect the latest published
          wallet-attribution snapshot and are recomputed per response
          (never served from cache): `UNAVAILABLE` means no snapshot has
          been published yet.
        - Revoked labels are hidden unless `active_only=false`.
      parameters:
        - { $ref: "#/components/parameters/Network" }
        - { $ref: "#/components/parameters/Address" }
        - name: category
          in: query
          schema: { type: string }
          description: Filter by normalized category code (e.g. `EXCHANGE`,
            `SCAM`); an upstream string resolves to the same code.
        - name: source
          in: query
          schema: { type: string }
          description: Filter by data source code (e.g. `wallet_attribution`).
        - name: source_field
          in: query
          schema: { type: string }
          description: Substring match on the upstream `source` vocabulary
            inside evidence (e.g. `forta`, `eth-labels`).
        - name: verification_status
          in: query
          schema: { type: string, enum: [reported, unverified, verified, disputed] }
        - name: active_only
          in: query
          schema: { type: boolean, default: true }
          description: When false, soft-revoked labels are included with
            their `revoked_at` timestamp.
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque base64 cursor from a previous `next_cursor`.
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200, minimum: 1 }
      responses:
        "200":
          description: Label page plus freshness metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/LabelPage" }
              examples:
                labeled:
                  summary: Labeled wallet
                  value:
                    data:
                      network: ethereum
                      address: "0x00000000000000000000000000000000000000a1"
                      normalized_address: "0x00000000000000000000000000000000000000a1"
                      labels:
                        - wallet_label_id: 42
                          category: EXCHANGE
                          category_type: ENTITY_TYPE
                          label: "Binance: Hot Wallet"
                          entity: { id: 7, name: Binance }
                          source: { code: wallet_attribution, name: "Wallet Attribution (prettydeath)" }
                          source_field: "eth-labels+cex-list"
                          source_url: "https://example.com"
                          upstream_category: exchange
                          confidence: high
                          verification_status: reported
                          evidence:
                            source_field: "eth-labels+cex-list"
                            upstream_record: { label: "Binance: Hot Wallet", entity: Binance }
                            fetch_checksum_part: "ab12cd34ef56…"
                            observed_at: "2026-10-01T00:00:00Z"
                          observed_at: "2026-10-01T00:00:00Z"
                          first_seen_at: "2026-11-03T12:00:00Z"
                          last_seen_at: "2026-11-03T12:00:00Z"
                          revoked_at: null
                      labels_count: 1
                      next_cursor: ""
                      data_status: AVAILABLE
                      last_synced_at: "2026-11-03T12:00:00Z"
                revoked:
                  summary: Revoked label (active_only=false)
                  value:
                    data:
                      network: ethereum
                      address: "0x00000000000000000000000000000000000000a5"
                      normalized_address: "0x00000000000000000000000000000000000000a5"
                      labels:
                        - wallet_label_id: 46
                          category: HACK
                          category_type: MALICIOUS_ACTIVITY
                          label: "Null Entity Label"
                          entity: { id: 9, name: "Null" }
                          source: { code: wallet_attribution, name: "Wallet Attribution (prettydeath)" }
                          source_field: forta
                          source_url: "https://example.com"
                          upstream_category: hack
                          confidence: high
                          verification_status: reported
                          evidence: {}
                          observed_at: "2026-10-01T00:00:00Z"
                          first_seen_at: "2026-11-03T12:00:00Z"
                          last_seen_at: "2026-11-04T12:00:00Z"
                          revoked_at: "2026-11-04T12:00:00Z"
                      labels_count: 1
                      next_cursor: ""
                      data_status: AVAILABLE
                      last_synced_at: "2026-11-04T12:00:00Z"
                unlabeled:
                  summary: Unlabeled wallet (no data — not a verdict)
                  value:
                    data:
                      network: ethereum
                      address: "0x00000000000000000000000000000000deadbeef"
                      normalized_address: "0x00000000000000000000000000000000deadbeef"
                      labels: []
                      labels_count: 0
                      next_cursor: ""
                      data_status: AVAILABLE
                      last_synced_at: "2026-11-03T12:00:00Z"
        "400":
          description: Invalid address/network/filters or malformed cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                invalidCursor:
                  value:
                    error:
                      code: INVALID_CURSOR
                      message: invalid cursor
                      request_id: "req_123"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/wallets/{network}/{address}/enrichment:
    get:
      tags: [wallets]
      summary: Live multi-provider enrichment for a wallet
      description: |
        Fans out to the registered live providers (GoPlus, PublicAML,
        Chainabuse) with cache-first semantics and returns per-provider
        observations, signals, provider scores, and indirect exposures.

        **Semantics — read before consuming:**

        - `provider_score` is the **provider's own** score (e.g. PublicAML
          `aml_score`); it is never the internal risk score and not ground
          truth. A score of `0` is data, **not** a safe verdict —
          especially under a non-`OK` provider status.
        - `status` aggregates per-provider outcomes: `COMPLETED` when every
          attempted provider succeeded, `PARTIAL` on a mix, `FAILED` when
          every attempted provider failed, `INSUFFICIENT_DATA` when nothing
          was attempted (e.g. all disabled).
        - Per-provider `status` uses the persisted vocabulary: `OK`,
          `DEGRADED`, `RATE_LIMITED`, `TIMEOUT`, `UPSTREAM_5XX`,
          `CLIENT_4XX`, `MALFORMED`, `CIRCUIT_OPEN`, `DISABLED`,
          `TRANSPORT`, `ERROR`. `DISABLED` means the provider is configured
          off (e.g. no API key) and made **zero** outbound calls — it does
          not count as attempted.
        - `error.retry_after` is expressed in **seconds** (integer), carried
          through from the upstream `Retry-After` hint.
        - `cached:true` marks a response served from the provider cache;
          `cache_expires_at` states when the cached entry expires (UTC).
          Positive entries live 15 minutes; negative/degraded entries live
          60 seconds and can never replay as clean (their `status` is
          embedded in the cached payload). `cache:"bypassed"` marks a
          Redis outage — the endpoint fails open rather than failing.
        - `persisted` reports whether the fetch that produced this result
          wrote a `provider_observations` audit row — on a `cached:true`
          hit it reflects the original fetch's outcome, not this request.
          Persistence failures never alter provider status.
        - `observations[]` are normalized risk signals — all
          `reported`/`unverified`, never auto-verified. `exposures[]` are
          indirect graph-derived exposures, kept strictly separate: a graph
          path never implies ownership or direct attribution.
        - `refresh` parses via `strconv.ParseBool`. When true it bypasses
          the cache read (still writes through) **but is quota-guarded**:
          one bypass per (source, network, address) per 60 s cooldown —
          inside the cooldown the flag behaves as a normal request. A cache
          miss always fetches regardless of the flag.
        - Provider `Authorization` headers are never logged (spec §16).
      parameters:
        - { $ref: "#/components/parameters/Network" }
        - { $ref: "#/components/parameters/Address" }
        - name: refresh
          in: query
          schema: { type: boolean, default: false }
          description: Bypass the cache read when the per-key cooldown
            allows it (see description above).
        - name: providers
          in: query
          schema: { type: string }
          description: Comma-separated provider subset (e.g.
            `goplus,publicaml`). Empty or absent means every registered
            provider; an unknown name returns `400 BAD_REQUEST`.
      responses:
        "200":
          description: Enrichment result — check per-provider statuses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EnrichmentResult" }
              example:
                data:
                  network: ethereum
                  address: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"
                  normalized_address: "0x098b716b8aaf21512996dc57eb0615e2383e2f96"
                  status: PARTIAL
                  providers:
                    - source: goplus
                      enabled: true
                      status: OK
                      cached: false
                      fetched_at: "2026-11-03T12:00:01Z"
                      cache_expires_at: "2026-11-03T12:15:01Z"
                      http_status: 200
                      latency_ms: 340
                      persisted: true
                      observations:
                        - category: SANCTIONED
                          label: sanctioned
                          entity: ""
                          source_url: ""
                          confidence: unknown
                          verification_status: reported
                          observed_at: "2026-11-03T12:00:01Z"
                          evidence:
                            { "field": "sanctioned", "value": "1",
                              "data_source": "SlowMist,BlockSec" }
                      signals: { data_source: "SlowMist,BlockSec" }
                      exposures: []
                    - source: publicaml
                      enabled: true
                      status: OK
                      cached: false
                      fetched_at: "2026-11-03T12:00:02Z"
                      cache_expires_at: "2026-11-03T12:15:02Z"
                      http_status: 200
                      latency_ms: 812
                      persisted: true
                      provider_score: 100.0
                      observations:
                        - category: SANCTIONED
                          label: sanction
                          entity: "Lazarus Group"
                          confidence: unknown
                          verification_status: reported
                          observed_at: "2026-11-03T12:00:02Z"
                          evidence:
                            category: sanction
                            score: 100.0
                            source: "ofac:sdn_advanced"
                      signals:
                        label: "Lazarus Group"
                        category: sanction
                        sanctioned: true
                      exposures:
                        - counterparty: "0x35fb6f6db4fb05e6a4ce86f2c93691425626d4b1"
                          category: sanction
                          hops: 1
                          score: 90.0
                          direction: outbound
                    - source: chainabuse
                      enabled: false
                      status: DISABLED
                      cached: false
                      persisted: false
                      error:
                        code: disabled
                        message: "provider not enabled — no outbound call made"
                      observations: []
                      signals: {}
                      exposures: []
                  enriched_at: "2026-11-03T12:00:03Z"
        "400":
          description: Invalid network/address, malformed `refresh`, or
            unknown provider in `providers`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: BAD_REQUEST
                  message: unknown provider in providers filter
                  request_id: "req_123"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/wallets/{network}/{address}/transactions:
    get:
      tags: [wallets]
      summary: Indexed transactions for a wallet
      description: |
        Lazy on-demand indexing: the wallet's native + fungible-token
        transfer history is fetched from the configured provider on first
        request, then served from the index under the freshness gate.
        `index_scope: "native+token"` declares that INTERNAL transfers and
        NFTs are out of scope. A provider failure, bounded fetch, or
        DISABLED provider is reported honestly in the coverage fields —
        never as a clean empty list. Reverted transactions are retained
        with `is_error=true` (they move nothing, but are forensic data).
      parameters:
        - { $ref: "#/components/parameters/Network" }
        - { $ref: "#/components/parameters/Address" }
        - name: direction
          in: query
          schema: { type: string, enum: [in, out, self] }
          description: >-
            Edge direction relative to the wallet. A wallet→wallet self
            transfer is emitted once with `direction="self"` and matches
            both `in` and `out` filters.
        - name: asset
          in: query
          schema: { type: string }
          description: '`native` or a token contract address.'
        - name: from_timestamp
          in: query
          schema: { type: string, format: date-time }
        - name: to_timestamp
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque keyset cursor from a previous `next_cursor`.
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100, minimum: 1 }
        - name: refresh
          in: query
          schema: { type: boolean, default: false }
          description: >-
            Bypasses the freshness gate (re-fetches); the FAILED cooldown
            still holds.
      responses:
        "200":
          description: Indexed transaction page plus index coverage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TransactionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/wallets/{network}/{address}/exposures:
    get:
      tags: [wallets]
      summary: Bounded 1–5 hop exposure tracing
      description: |
        Bounded BFS over indexed transfers (`tracing_method:
        "bounded_bfs"`). Hop-1 counterparties come from the root wallet's
        index; each may become an ordered expansion position whose own
        index is lazily built for deeper hops, one frontier per depth up
        to `max_hops`. A **path is transaction evidence, never
        ownership**: `direct_counterparty` / `indirect_hop` describe
        graph distance only — a path does not prove shared control or
        identical fund flow. Expansion never crosses networks; labels
        observed for the same normalized address on a *different*
        network are reported as `kind:"label"` signals carrying
        `network` + `listed_address` provenance, never local category
        winners. Each item carries `exposure_score` — a separately
        versioned (`exposure_policy_version`) evidence weight in
        0–100 (null when every signal is informational-only); it never
        feeds `risk_score`. Bounds are honest: `truncated` (sibling of `coverage`)
        names the binding reason (deadline > max_provider_requests >
        max_nodes > max_edges > response_cap > limit), and the
        `*_by_hop` maps report per-frontier positions, attempts,
        emitted contiguous prefixes, and remainder. Reverted
        transfers (`is_error`) produce no edges.
      parameters:
        - { $ref: "#/components/parameters/Network" }
        - { $ref: "#/components/parameters/Address" }
        - name: max_hops
          in: query
          schema: { type: integer, enum: [1, 2, 3, 4, 5], default: 2 }
          description: '`=1` emits hop-1 items only; `0` or `>5` → 400.'
        - name: direction
          in: query
          schema: { type: string, enum: [in, out] }
          description: >-
            Filters the hop-1 edge set before position derivation;
            deeper-hop edges are bidirectional facts (unfiltered).
            Default is both directions.
        - name: category
          in: query
          schema: { type: string }
          description: Post-assembly filter over all `matched_signals`.
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100, minimum: 1 }
        - name: refresh
          in: query
          schema: { type: boolean, default: false }
          description: >-
            Applies to every index performed this request; the FAILED
            cooldown still holds.
      responses:
        "200":
          description: Matched counterparties with evidence + coverage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ExposureResult" }
              example:
                data:
                  items:
                    - counterparty: "0x00000000000000000000000000000000000000c9"
                      category: cross_chain_listing
                      matched_signals:
                        - kind: label
                          category: SCAM
                          label: seeded-foreign
                          source: wallet_attribution
                          verification_status: reported
                          network: bsc
                          listed_address: "0x00000000000000000000000000000000000000C9"
                      relationship: indirect_hop
                      hops: 3
                      exposure_score: 12
                      paths:
                        - hop_count: 3
                          path_verified: false
                          temporal_order_valid: true
                          edges:
                            - from_address: "0x00000000000000000000000000000000000000b1"
                              to_address: "0x00000000000000000000000000000000000000a1"
                              network: ethereum
                              tx_hash: "0xd1"
                              transfer_index: "0"
                              transfer_type: NATIVE
                              asset: native
                              amount_raw: "7"
                              block_number: 90
                              block_timestamp: "2023-11-14T22:13:20Z"
                              confirmation_status: confirmed
                            - from_address: "0x00000000000000000000000000000000000000b2"
                              to_address: "0x00000000000000000000000000000000000000b1"
                              network: ethereum
                              tx_hash: "0xd2"
                              transfer_index: "0"
                              transfer_type: NATIVE
                              asset: native
                              amount_raw: "7"
                              block_number: 95
                              block_timestamp: "2023-11-14T22:13:25Z"
                              confirmation_status: confirmed
                            - from_address: "0x00000000000000000000000000000000000000c9"
                              to_address: "0x00000000000000000000000000000000000000b2"
                              network: ethereum
                              tx_hash: "0xd3"
                              transfer_index: "0"
                              transfer_type: NATIVE
                              asset: native
                              amount_raw: "7"
                              block_number: 100
                              block_timestamp: "2023-11-14T22:13:30Z"
                              confirmation_status: confirmed
                      transaction_evidence:
                        - from_address: "0x00000000000000000000000000000000000000b1"
                          to_address: "0x00000000000000000000000000000000000000a1"
                          network: ethereum
                          tx_hash: "0xd1"
                          transfer_index: "0"
                          transfer_type: NATIVE
                          asset: native
                          amount_raw: "7"
                          block_number: 90
                          block_timestamp: "2023-11-14T22:13:20Z"
                          confirmation_status: confirmed
                        - from_address: "0x00000000000000000000000000000000000000b2"
                          to_address: "0x00000000000000000000000000000000000000b1"
                          network: ethereum
                          tx_hash: "0xd2"
                          transfer_index: "0"
                          transfer_type: NATIVE
                          asset: native
                          amount_raw: "7"
                          block_number: 95
                          block_timestamp: "2023-11-14T22:13:25Z"
                          confirmation_status: confirmed
                        - from_address: "0x00000000000000000000000000000000000000c9"
                          to_address: "0x00000000000000000000000000000000000000b2"
                          network: ethereum
                          tx_hash: "0xd3"
                          transfer_index: "0"
                          transfer_type: NATIVE
                          asset: native
                          amount_raw: "7"
                          block_number: 100
                          block_timestamp: "2023-11-14T22:13:30Z"
                          confirmation_status: confirmed
                  tracing_method: bounded_bfs
                  exposure_policy_version: exposure-v1
                  truncated: null
                  coverage:
                    counterparties_total: 2
                    nodes_examined: 2
                    positions_emitted: 2
                    nodes_remaining: 0
                    nodes_failed: 0
                    edges_examined: 3
                    provider_calls: 6
                    provider_status: ok
                    sanctions_snapshot_version: null
                    labels_snapshot_version: null
                    node_indexed_until:
                      "0x00000000000000000000000000000000000000b1": 100
                      "0x00000000000000000000000000000000000000b2": 100
                    head_block: 100
                    frontier_by_hop: { "2": 1, "3": 1 }
                    nodes_examined_by_hop: { "2": 1, "3": 1 }
                    frontier_emitted_by_hop: { "2": 1, "3": 1 }
                    nodes_remaining_by_hop: { "2": 0, "3": 0 }
                    max_depth_reached: 3
                    root:
                      index_status: fresh
                      stale: false
                      provider_status: ok
                      indexed_until_block: 100
                      indexed_at: "2026-11-04T04:00:00Z"
                      history_truncated: false
                      index_scope: "native+token"
                      rows_indexed: 1
                      rows_skipped:
                        missing_contract: 0
                        invalid_address: 0
        "400": { $ref: "#/components/responses/BadRequest" }
