                  source_id: 1
                  status: COMPLETED
                  started_at: "2026-10-28T11:59:00Z"
                  completed_at: "2026-10-28T12:00:00Z"
                  records_fetched: 19500
                  records_inserted: 19500
                  records_updated: 19480
                  records_rejected: 0
                  triggered_by: bootstrap-admin
                  snapshot_checksum: "ab12cd34..."
                  snapshot_version: "ofac-ab12cd34ef56-1730126400"
                  error_message: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/provider-configs:
    get:
      tags: [admin]
      summary: List transaction-provider configurations
      description: |
        One entry per registered transaction-history provider (12 codes).
        Providers without a `provider_configs` row appear with
        `configured:false` and are PUT-discoverable; their shown `status`
        is the default `active`. `api_key` is always the masked shape —
        plaintext never leaves this surface.
      responses:
        "200":
          description: Provider list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderConfigView" }
              example:
                data:
                  - source_code: chainscan
                    configured: false
                    api_key: { set: false, last4: null }
                    base_url: null
                    enabled_chains: null
                    status: active
                    catalog_active: true
                    effective_active: true
                    requires_restart: [api_key, base_url, enabled_chains]
                    updated_by: null
                    updated_at: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/provider-configs/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: Transaction provider code (a `data_sources.code`).
        schema:
          type: string
          enum: [alchemy, blockscout, ankr, covalent, moralis, tatum,
                 bitquery, oklink, tokenview, chainbase, chainscan, nodereal]
    get:
      tags: [admin]
      summary: Read one provider configuration
      responses:
        "200":
          description: Provider view.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ProviderConfigView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      summary: Update provider configuration (whitelisted fields)
      description: |
        Whitelisted fields only: `api_key`, `base_url`, `enabled_chains`,
        `status`. Unknown JSON keys are rejected with `400`. `api_key` is
        stored encrypted when `PROVIDER_CONFIG_KEK` is set and is never
        returned; audit rows record the masked shape only. Values
        beginning with `enc:` are rejected with `400`.

        `base_url` must be `https` and its host must be in the adapter's
        SSRF allowlist (same check adapters apply at construction);
        rejections echo `allowed_hosts`. `enabled_chains` elements must be
        registered network codes. `status` accepts `active`/`inactive`.

        Only `status` is runtime-effective (TTL ~30s): `api_key`,
        `base_url` and `enabled_chains` are stored but the running
        adapters keep the boot-resolved values — every response carries
        `requires_restart`, and `warnings[]` discloses stored≠in-effect
        drift, `enabled_chains:[]` (provider disabled on every network),
        and deactivating the last effective-active member of a failover
        chain.

        Every changed field writes a `provider_config_changes` audit row
        in the same transaction; unchanged fields write nothing. Updates
        are column-scoped under a row lock, so concurrent PUTs to
        different fields do not lose each other.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderConfigPatch" }
            example:
              status: inactive
      responses:
        "200":
          description: Post-write view plus warnings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ProviderConfigView" }
                  warnings:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderConfigWarning" }
              example:
                data:
                  source_code: chainscan
                  configured: true
                  api_key: { set: true, last4: "4242" }
                  base_url: null
                  enabled_chains: [ethereum]
                  status: inactive
                  catalog_active: true
                  effective_active: false
                  requires_restart: [api_key, base_url, enabled_chains]
                  updated_by: ops-admin
                  updated_at: "2026-11-04T23:00:00Z"
                warnings:
                  - code: last_active_member
                    network: ethereum
                    message: "deactivating chainscan leaves the ethereum failover chain with no active member"
        "400":
          description: Invalid field value or unknown key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: BAD_REQUEST
                  message: 'base_url host "evil.example.com" not in allowlist ["api.etherscan.io"]'
                  allowed_hosts: ["api.etherscan.io", "api.bscscan.com"]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/provider-configs/{code}/changes:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          enum: [alchemy, blockscout, ankr, covalent, moralis, tatum,
                 bitquery, oklink, tokenview, chainbase, chainscan, nodereal]
    get:
      tags: [admin]
      summary: Provider configuration audit history
      description: |
        Audit rows newest-first, keyset-paginated by `cursor` (opaque
        token from `next_cursor`); `limit` defaults to 50, max 100.
        `api_key` changes record the masked shape in `previous_value` /
        `new_value` — plaintext keys never appear.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Audit page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ProviderConfigChange" }
                      next_cursor: { type: string }
              example:
                data:
                  items:
                    - id: "5d3f1e2a-9b4c-4d5e-8f9a-0b1c2d3e4f5a"
                      field: status
                      previous_value: "active"
                      new_value: "inactive"
                      actor_id: ops-admin
                      actor_type: api_client
                      changed_at: "2026-11-04T23:00:00Z"
                  next_cursor: "eyJ0IjoiMjAyNi0xMS0wNFQyMzowMDowMFoiLCJpIjoiNWQzZjFlMmEtOWI0Yy00ZDVlLThmOWEtMGIxYzJkM2U0ZjVhIn0"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/clients:
    get:
      tags: [admin]
      summary: List API clients
      description: |
        Clients newest-first, keyset-paginated by `cursor` (opaque token
        from `next_cursor`); `limit` defaults to 50, values over 200 clamp
        to 200, non-positive/non-integer values are `400`. Every item is
        the enumerated view only — `key_hash` and raw key material never
        appear on this surface.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Client page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ApiClient" }
                      next_cursor: { type: string }
              example:
                data:
                  items:
                    - id: 42
                      name: partner-acme
                      role: reader
                      is_active: true
                      created_at: "2026-11-05T09:30:00Z"
                      last_seen_at: "2026-11-05T10:12:44Z"
                  next_cursor: "eyJ0IjoiMjAyNi0xMS0wNVQwOTozMDowMFoiLCJpIjo0Mn0"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Create an API client — plaintext key shown exactly once
      description: |
        The server generates a `cw_<rand>` key (base64url of 32 crypto/rand
        bytes), stores only its SHA-256 hex digest, and returns the
        plaintext **exactly once** in this response under
        `Cache-Control: no-store`. There is no recovery: a lost key means
        creating a new client and deactivating the old one.

        `name` is display metadata (1–150 characters, duplicates allowed —
        `id` is identity); `role` is `reader` (partners) or `admin`
        (internal). The endpoint is intentionally not idempotent: a
        retried create mints a second live key; duplicates are
        list-visible and revocable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiClientCreate" }
            example: { name: partner-acme, role: reader }
      responses:
        "201":
          description: Client created; `api_key` is shown exactly once.
          headers:
            Cache-Control:
              description: Always `no-store` — plaintext key material must not be cached.
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ApiClientCreated" }
              example:
                data:
                  id: 43
                  name: partner-acme
                  role: reader
                  is_active: true
                  created_at: "2026-11-05T09:31:07Z"
                  last_seen_at: null
                  api_key: "cw_9f3kQ2xVbN8pLmZ4tRwY7uHsA1dFgJ6kMnB5vCxZ0qE"
                  note: "api_key is shown exactly once — store it securely; it cannot be retrieved again"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Client id (BIGSERIAL). Non-numeric → `400`; absent → `404`.
        schema: { type: integer, format: int64 }
    patch:
      tags: [admin]
      summary: Update an API client (whitelisted fields)
      description: |
        Whitelisted fields only: `name`, `role`, `is_active`. Unknown JSON
        keys are rejected with `400`; `PATCH {}` is a no-op returning the
        current view. Writes are column-scoped, so `last_seen_at` and
        concurrently patched sibling fields are preserved.

        **Admin-lockout guards** — both return `409 ADMIN_LOCKOUT`:
        (a) the acting client may never demote or deactivate **its own**
        row (self no-ops like `{role:"admin"}` and self-renames pass);
        (b) a mutation that removes an *active admin* is rejected when
        zero other `role=admin AND is_active` rows remain — evaluated
        post-state, so touching an already-inactive admin succeeds.

        Patching a row seeded by `API_BOOTSTRAP_*` succeeds but returns a
        `warnings[]` entry with code `env_managed`: the boot upsert
        restores `name`/`role`/`is_active` at every restart, so a
        revocation only persists after the env var is unset.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiClientPatch" }
            example: { is_active: false }
      responses:
        "200":
          description: Post-write view plus warnings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ApiClient" }
                  warnings:
                    type: array
                    items: { $ref: "#/components/schemas/ApiClientWarning" }
              example:
                data:
                  id: 7
                  name: bootstrap-admin
                  role: admin
                  is_active: false
                  created_at: "2026-10-28T08:00:00Z"
                  last_seen_at: "2026-11-05T10:12:44Z"
                warnings:
                  - code: env_managed
                    message: "this client is managed by API_BOOTSTRAP_* env vars — the change is reverted at restart while the env var is set; unset API_BOOTSTRAP_* to revoke permanently"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Admin-lockout guard rejected the mutation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: ADMIN_LOCKOUT, message: "operation would remove the last active admin", request_id: "req_..." }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    Network:
      name: network
      in: path
      required: true
      description: Network code.
      schema: { type: string, enum: [ethereum, bsc] }
    Address:
      name: address
      in: path
      required: true
      description: EVM address (20-byte hex, 0x prefix optional).
      schema:
        type: string
        pattern: "^(0x)?[0-9a-fA-F]{40}$"
        example: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"

  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string, enum: [ok] }
    ReadyStatus:
      type: object
      properties:
        postgres: { type: string, enum: [ok, down] }
        redis: { type: string, enum: [ok, down] }
    Network:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        chain_id: { type: string, description: "CAIP-2 identifier" }
        namespace: { type: string }
    Wallet:
      type: object
      properties:
        network: { type: string }
        address: { type: string }
        normalized_address: { type: string }
        address_type: { type: string }
        labels:
          type: array
          items: { $ref: "#/components/schemas/LabelSummary" }
          description: First five active public-label summaries.
        labels_count:
          type: integer
          description: Total active labels for the wallet (all sources).
        data_status: { $ref: "#/components/schemas/DataStatus" }
        last_synced_at: { type: ["string", "null"], format: date-time }
        first_seen_at: { type: string, format: date-time }
    DataStatus:
      type: string
      enum: [AVAILABLE, STALE, UNAVAILABLE]
      description: Snapshot freshness recomputed at serve time.
    LabelSummary:
      type: object
      properties:
        wallet_label_id: { type: integer }
        category: { type: string, description: Normalized category code }
        category_type:
          type: string
          enum: [LEGAL, MALICIOUS_ACTIVITY, SERVICE_TYPE, ENTITY_TYPE, OTHER]
        label: { type: string }
        entity:
          type: ["object", "null"]
          properties:
            id: { type: integer }
            name: { type: string }
        confidence: { type: string, enum: [unknown, low, medium, high] }
        verification_status:
          type: string
          enum: [unverified, reported, verified, disputed]
    Label:
      allOf:
        - $ref: "#/components/schemas/LabelSummary"
        - type: object
          properties:
            source:
              type: object
              properties:
                code: { type: string }
                name: { type: string }
            source_field:
              type: string
              description: Upstream `source` vocabulary (e.g. eth-labels+cex-list).
            source_url: { type: ["string", "null"] }
            upstream_category: { type: ["string", "null"] }
            evidence:
              type: object
              description: Provenance payload — upstream_record, source_field,
                fetch_checksum_part, observed_at/date_unparsed.
            observed_at: { type: ["string", "null"], format: date-time }
            first_seen_at: { type: ["string", "null"], format: date-time }
            last_seen_at: { type: ["string", "null"], format: date-time }
            revoked_at: { type: ["string", "null"], format: date-time }
    LabelPage:
      type: object
      properties:
        network: { type: string }
        address: { type: string }
        normalized_address: { type: string }
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        labels_count:
          type: integer
          description: Total rows matching the active filters (not page size).
        next_cursor:
          type: string
          description: Opaque base64 cursor for the next page; empty when done.
        data_status: { $ref: "#/components/schemas/DataStatus" }
        last_synced_at: { type: ["string", "null"], format: date-time }
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
    Reason:
      type: object
      properties:
        summary:
          type: ["string", "null"]
          description: Only populated from official source text; never synthesized.
        status:
          type: string
          enum: [OFFICIAL_EXPLICIT, PROGRAM_CONTEXT_ONLY, NOT_AVAILABLE]
    ProgramRef:
      type: object
      properties:
        code: { type: string }
        name: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        source_url: { type: ["string", "null"], format: uri }
        revoked:
          type: boolean
          description: Link absent from the latest snapshot — provenance only, never a live association.
    SourceRef:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        url: { type: ["string", "null"], format: uri }
    SanctionEntry:
      type: object
      properties:
        sanctions_entity_id: { type: integer }
        external_entity_id: { type: string }
        entity_name: { type: string }
        entity_type: { type: ["string", "null"] }
        listed_address: { type: string }
        currency_code: { type: ["string", "null"] }
        identifier_type: { type: string }
        match_scope: { type: string, enum: [CHAIN_SPECIFIC, UNRESOLVED] }
        programs:
          type: array
          items: { $ref: "#/components/schemas/ProgramRef" }
        reason: { $ref: "#/components/schemas/Reason" }
        source: { $ref: "#/components/schemas/SourceRef" }
    Observation:
      type: object
      description: A listing of the same address that cannot count as a direct match.
      properties:
        network_code: { type: ["string", "null"] }
        currency_code: { type: ["string", "null"] }
        listed_address: { type: string }
        sanctions_entity_id: { type: integer }
        entity_name: { type: string }
        match_scope: { type: string }
        identifier_type: { type: string }
        source_code: { type: string }
    EnrichmentResult:
      type: object
      description: |
        Live multi-provider enrichment. `status` aggregates per-provider
        outcomes; every provider block keeps its own typed status — a
        failure is never hidden inside a verdict and `provider_score` is
        never the internal risk score.
      properties:
        network: { type: string }
        address: { type: string }
        normalized_address: { type: string }
        status:
          type: string
          enum: [COMPLETED, PARTIAL, FAILED, INSUFFICIENT_DATA]
        providers:
          type: array
          items: { $ref: "#/components/schemas/EnrichmentProvider" }
        enriched_at: { type: string, format: date-time }
    EnrichmentProvider:
      type: object
      properties:
        source: { type: string, enum: [goplus, publicaml, chainabuse] }
        enabled: { type: boolean }
        status:
          type: string
          enum: [OK, DEGRADED, RATE_LIMITED, TIMEOUT, UPSTREAM_5XX,
                 CLIENT_4XX, MALFORMED, CIRCUIT_OPEN, DISABLED, TRANSPORT, ERROR]
        cached: { type: boolean }
        cache:
          type: string
          enum: [bypassed]
          description: Present only when Redis was unreachable (fail-open).
        fetched_at: { type: string, format: date-time }
        cache_expires_at: { type: string, format: date-time }
        http_status: { type: integer }
        latency_ms: { type: integer }
        persisted: { type: boolean }
        error: { $ref: "#/components/schemas/ProviderError" }
        provider_score:
          type: number
          description: The provider's own score — never the internal risk
            score; 0 is data, not a safe verdict.
        observations:
          type: array
          items: { $ref: "#/components/schemas/EnrichmentObservation" }
        signals:
          type: object
          additionalProperties: true
          description: Provider-native fields kept verbatim; always `{}` when empty.
        exposures:
          type: array
          items: { $ref: "#/components/schemas/EnrichmentExposure" }
    ProviderError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        retry_after:
          type: integer
          description: Upstream Retry-After hint in seconds.
    EnrichmentObservation:
      type: object
      description: One normalized provider signal — reported, never auto-verified.
      properties:
        category: { type: string }
        label: { type: string }
        entity: { type: string }
        source_url: { type: string }
        confidence: { type: string }
        verification_status: { type: string, enum: [reported, unverified] }
        observed_at: { type: string, format: date-time }
        evidence: { type: object, additionalProperties: true }
    EnrichmentExposure:
      type: object
      description: Indirect graph-derived exposure — never direct attribution.
      properties:
        counterparty: { type: string }
        category: { type: string }
        hops: { type: integer }
        score: { type: number }
        direction: { type: string, enum: [outbound, inbound, mixed] }
    WalletSanctionsLookup:
      type: object
      properties:
        network: { type: string }
        address: { type: string }
        normalized_address: { type: string }
        matched: { type: boolean }
        match_type: { type: ["string", "null"], enum: [WALLET_EXACT, null] }
        match_scope: { type: ["string", "null"], enum: [CHAIN_SPECIFIC, null] }
        sanctions:
          type: array
          items: { $ref: "#/components/schemas/SanctionEntry" }
        cross_chain_observations:
          type: array
          items: { $ref: "#/components/schemas/Observation" }
        unresolved_network_listings:
          type: array
          items: { $ref: "#/components/schemas/Observation" }
        data_status: { $ref: "#/components/schemas/DataStatus" }
        last_synced_at: { type: ["string", "null"], format: date-time }
    EntityAddress:
      type: object
      properties:
        listed_address: { type: string }
        normalized_address: { type: string }
        currency_code: { type: ["string", "null"] }
        network_id: { type: ["integer", "null"] }
        identifier_type: { type: string }
        source_identifier_id: { type: ["string", "null"] }
        match_scope: { type: string }
        revoked: { type: boolean }
    EntityReference:
      type: object
      properties:
        reference_type: { type: string }
        title: { type: ["string", "null"] }
        reference_url: { type: ["string", "null"], format: uri }
        published_at: { type: ["string", "null"], format: date-time }
        revoked:
          type: boolean
          description: Reference absent from the latest snapshot — retained for audit (spec §6).
    EntityDetail:
      type: object
      properties:
        sanctions_entity_id: { type: integer }
        external_entity_id: { type: string }
        entity_name: { type: string }
        entity_type: { type: ["string", "null"] }
        source_url: { type: ["string", "null"], format: uri }
        revoked: { type: boolean }
        programs:
          type: array
          items: { $ref: "#/components/schemas/ProgramRef" }
        reason: { $ref: "#/components/schemas/Reason" }
        digital_currency_addresses:
          type: array
          items: { $ref: "#/components/schemas/EntityAddress" }
        official_references:
          type: array
          items: { $ref: "#/components/schemas/EntityReference" }
        details: { type: object }
        source: { $ref: "#/components/schemas/SourceRef" }
        data_status: { $ref: "#/components/schemas/DataStatus" }
        last_synced_at: { type: ["string", "null"], format: date-time }
    ProgramDetail:
      type: object
      properties:
        code: { type: string }
        name: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        source_url: { type: ["string", "null"], format: uri }
        source_code: { type: string }
        associated_entities_count: { type: integer }
        data_status: { $ref: "#/components/schemas/DataStatus" }
        last_synced_at: { type: ["string", "null"], format: date-time }
    IngestionRun:
      type: object
      properties:
        run_id: { type: string, format: uuid }
        source_id: { type: integer }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        started_at: { type: string, format: date-time }
        completed_at: { type: ["string", "null"], format: date-time }
        records_fetched: { type: integer }
        records_inserted: { type: integer }
        records_updated: { type: integer }
        records_rejected: { type: integer }
        triggered_by: { type: ["string", "null"] }
        snapshot_checksum: { type: ["string", "null"] }
        snapshot_version: { type: ["string", "null"] }
        error_message: { type: ["string", "null"] }
    ApiClient:
      type: object
      description: |
        One api_clients row on the wire — enumerated fields only;
        `key_hash` and raw key material never appear.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        role: { type: string, enum: [reader, admin] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: ["string", "null"], format: date-time }
    ApiClientCreated:
      type: object
      description: |
        POST /admin/clients response — the ApiClient view plus `api_key`,
        the only response that ever carries plaintext key material. The
        row stores SHA-256 only; the key cannot be retrieved again.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        role: { type: string, enum: [reader, admin] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: ["string", "null"], format: date-time }
        api_key:
          type: string
          description: "`cw_` + base64url(32 bytes) — shown exactly once."
        note: { type: string }
    ApiClientCreate:
      type: object
      description: |
        POST body — whitelisted fields only; unknown keys are `400`.
        `name` counts characters (1–150), not bytes.
      required: [name, role]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        role: { type: string, enum: [reader, admin] }
    ApiClientPatch:
      type: object
      description: |
        PATCH body — whitelisted fields only; unknown keys are `400`.
        `{}` is a no-op returning the current view.
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        role: { type: string, enum: [reader, admin] }
        is_active: { type: boolean }
    ApiClientWarning:
      type: object
      description: |
        Non-obvious effect of a write. `env_managed` means the row is
        seeded by `API_BOOTSTRAP_*` and the boot upsert resurrects its
        name/role/is_active at every restart — revocation persists only
        after the env var is unset.
      properties:
        code:
          type: string
          enum: [env_managed]
        message: { type: string }
    ProviderConfigView:
      type: object
      description: |
        One provider's stored `provider_configs` row. `api_key` is the
        masked shape `{"set":bool,"last4":string|null}` — `last4` is
        suppressed for keys shorter than 8 characters. `configured:false`
        means no row exists (env-only behaviour; PUT materializes one).
        `status` is the operator switch and the only runtime-effective
        field; `catalog_active` is `data_sources.is_active` and AND's
        into `effective_active`. Fields listed in `requires_restart`
        need an API restart before the running adapters pick them up.
      properties:
        source_code: { type: string }
        configured: { type: boolean }
        api_key:
          type: object
          properties:
            set: { type: boolean }
            last4: { type: ["string", "null"] }
        base_url: { type: ["string", "null"] }
        enabled_chains:
          type: ["array", "null"]
          items: { type: string }
        status: { type: string, enum: [active, inactive] }
        catalog_active: { type: boolean }
        effective_active: { type: boolean }
        requires_restart:
          type: array
          items: { type: string, enum: [api_key, base_url, enabled_chains] }
        updated_by: { type: ["string", "null"] }
        updated_at: { type: ["string", "null"], format: date-time }
    ProviderConfigPatch:
      type: object
      description: |
        Whitelisted writable fields; absent keys leave the column
        untouched. `""` and `[]` are explicit overrides (they do NOT
        fall back to env). `api_key` rejects values starting with `enc:`;
        `base_url` must be `https` on the adapter allowlist (rejections
        echo `allowed_hosts`); `enabled_chains` elements must be
        registered network codes.
      additionalProperties: false
      properties:
        api_key: { type: string }
        base_url: { type: string }
        enabled_chains:
          type: array
          items: { type: string }
        status: { type: string, enum: [active, inactive] }
    ProviderConfigWarning:
      type: object
      description: |
        Non-obvious effect of a write. `code` is one of
        `requires_restart` (stored≠in-effect until restart),
        `no_enabled_chains` (`[]` disables the provider everywhere),
        `last_active_member` (failover chain left with no active member).
      properties:
        code:
          type: string
          enum: [requires_restart, no_enabled_chains, last_active_member]
        field: { type: string }
        network: { type: string }
        message: { type: string }
    ProviderConfigChange:
      type: object
      description: |
        One audit row. For `field:"api_key"` the values are the masked
        shape `{"set":bool,"last4":string|null}`; other fields record the
        stored value itself.
      properties:
        id: { type: string, format: uuid }
        field: { type: string, enum: [api_key, base_url, enabled_chains, status] }
        previous_value: { }
        new_value: { }
        actor_id: { type: ["string", "null"] }
        actor_type: { type: string }
        changed_at: { type: string, format: date-time }
    ScreeningRequest:
      type: object
      required: [network, address]
      properties:
        network:
          type: string
          description: Network code.
          example: ethereum
        address:
          type: string
          description: EVM address (20-byte hex, 0x prefix optional).
          pattern: "^(0x)?[0-9a-fA-F]{40}$"
        options:
          type: object
          properties:
            include_sanctions:
              type: boolean
              default: true
              description: Evaluate the direct-sanctions dimension.
            include_labels:
              type: boolean
              default: true
              description: Evaluate the direct-labels dimension.
            include_exposure:
              type: boolean
              default: true
              description: |
                Include provider-reported exposures. `false` marks
                `exposures.evaluated=false` +
                `coverage.disabled_by_request` — never a clean verdict.
            max_hops:
              type: integer
              minimum: 0
              maximum: 2
              default: 2
              description: Exposure scoring bound; rejected outside 0–2.
            refresh_providers:
              type: boolean
              default: false
              description: Bypass the provider cache when the refresh
                cooldown allows it.
    ScreeningResult:
      type: object
      description: |
        The §9.7 screening result — persisted and replayed
        byte-identically. `risk_score` is NULL under
        `INSUFFICIENT_DATA`; `risk_level` UNKNOWN. A `LOW` score is a
        heuristic finding, not a safe verdict — read
        `data_completeness` alongside.
      properties:
        screening_id: { type: string, format: uuid }
        network: { type: string }
        address:
          type: string
          description: Normalized lowercase 0x address.
        status:
          type: string
          enum: [COMPLETED, PARTIAL, INSUFFICIENT_DATA, FAILED]
        risk_score:
          type: ["integer", "null"]
          minimum: 0
          maximum: 100
        risk_level:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL, UNKNOWN]
        direct_sanctions:
          type: object
          properties:
            evaluated:
              type: boolean
              description: false → the dimension was excluded by request.
            matched: { type: boolean }
            entries:
              type: array
              items: { $ref: "#/components/schemas/SanctionEntry" }
        direct_labels:
          type: object
          properties:
            evaluated: { type: boolean }
            items:
              type: array
              items: { $ref: "#/components/schemas/Label" }
            collected: { type: integer }
            truncated:
              type: boolean
              description: true → the 1000-label hard cap was reached.
        exposures:
          type: object
          properties:
            evaluated: { type: boolean }
            items:
              type: array
              items: { $ref: "#/components/schemas/ScreeningExposure" }
            coverage: { $ref: "#/components/schemas/ScreeningCoverage" }
        scoring: { $ref: "#/components/schemas/ScreeningScoring" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/EvidenceRef" }
        provider_status: { $ref: "#/components/schemas/ScreeningProviderStatus" }
        data_completeness: { $ref: "#/components/schemas/DataCompleteness" }
        screened_at: { type: string, format: date-time }
    ScreeningExposure:
      type: object
      description: |
        Provider-reported indirect exposure — `basis` is always
        `provider_reported`; never under `transaction_evidence` and
        never proof of ownership.
      properties:
        counterparty: { type: string }
        category: { type: string }
        hops: { type: integer }
        direction: { type: string }
        provider_score: { type: number }
        source: { type: string }
        basis:
          type: string
          enum: [provider_reported]
        scored:
          type: boolean
          description: |
            Whether hops satisfied `max_hops` ∧ ≤ 2. Unscored items are
            listed as reported evidence, never silently dropped.
    ScreeningCoverage:
      type: object
      properties:
        tracing:
          type: string
          enum: [provider_reported_only, bounded_bfs]
          description: >-
            Own-graph tracing is provider_reported_only on this surface;
            bounded_bfs is the /exposures method.
        max_hops_requested: { type: integer }
        disabled_by_request: { type: boolean }
    ScreeningScoring:
      type: object
      properties:
        policy_version:
          type: string
          enum: ["v1.0.0"]
        score:
          type: ["integer", "null"]
          minimum: 0
          maximum: 100
        risk_level:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL, UNKNOWN]
        flags:
          type: array
          items: { type: string, enum: [DIRECT_SANCTIONS] }
        blocks:
          type: object
          properties:
            direct: { $ref: "#/components/schemas/BlockScore" }
            exposure: { $ref: "#/components/schemas/BlockScore" }
            other: { $ref: "#/components/schemas/BlockScore" }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/ScoringReason" }
    BlockScore:
      type: object
      properties:
        subtotal: { type: integer }
        capped:
          type: boolean
          description: true → the block cap bound the subtotal.
    ScoringReason:
      type: object
      properties:
        code:
          type: string
          enum: [DIRECT_SANCTIONS_MATCH, DIRECT_LABEL,
                 LABEL_CLASSIFICATION, PROVIDER_OBSERVATION,
                 PROVIDER_SCORE, EXPOSURE_PROVIDER, CROSS_CHAIN_LISTING,
                 SNAPSHOT_STALE, PROVIDER_FAILED, NOT_EVALUATED]
        category: { type: string }
        verification_status:
          type: string
          enum: [verified, reported, unverified, disputed]
        weight: { type: integer }
        evidence_ref: { type: string }
    EvidenceRef:
      type: object
      description: |
        {kind, ref} joining reasons to proof — `wallet_labels.id` for
        labels, `{sanctions_entity_id}` for sanctions rows,
        `{source, fetched_at}` for provider observations.
      properties:
        kind:
          type: string
          enum: [sanctions, label, provider_observation, provider_score,
                 exposure, cross_chain_listing]
        ref:
          description: Scalar id or composite reference object.
    ScreeningProviderStatus:
      type: object
      properties:
        providers:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ScreeningProviderEntry" }
          description: Per-source outcome — OK / typed failure / DISABLED.
        fanout:
          $ref: "#/components/schemas/ScreeningProviderEntry"
          description: >
            Wholesale enrichment-pipeline failure, when the fan-out itself
            errored and no per-source results exist. A named sibling field —
            never a pseudo-provider key inside `providers`.
        sanctions: { $ref: "#/components/schemas/SnapshotStatus" }
        labels: { $ref: "#/components/schemas/SnapshotStatus" }
    ScreeningProviderEntry:
      type: object
      properties:
        status:
          type: string
          enum: [OK, DEGRADED, RATE_LIMITED, TIMEOUT, UPSTREAM_5XX,
                 CLIENT_4XX, MALFORMED, CIRCUIT_OPEN, DISABLED, TRANSPORT, ERROR]
        enabled: { type: boolean }
        cached: { type: boolean }
        fetched_at: { type: ["string", "null"], format: date-time }
        error: { $ref: "#/components/schemas/ProviderError" }
        provider_score:
          type: number
          description: The provider's own score — never the internal score.
    SnapshotStatus:
      type: object
      properties:
        data_status:
          type: string
          enum: [AVAILABLE, STALE, UNAVAILABLE, NOT_REQUESTED]
        last_synced_at: { type: ["string", "null"], format: date-time }
    DataCompleteness:
      type: object
      description: |
        Per-dimension availability — always accompanies a score;
        `usable=false` dimensions contribute nothing, `NOT_REQUESTED`
        was excluded by request.
      properties:
        sanctions: { $ref: "#/components/schemas/DimensionStatus" }
        labels: { $ref: "#/components/schemas/DimensionStatus" }
        labels_collected: { type: integer }
        labels_truncated: { type: boolean }
        providers:
          type: object
          properties:
            usable:
              type: array
              items: { type: string }
            degraded:
              type: array
              items: { type: string }
            disabled:
              type: array
              items: { type: string }
              description: DISABLED is configuration, not a failure.
        exposure: { $ref: "#/components/schemas/DimensionStatus" }
    DimensionStatus:
      type: object
      properties:
        requested: { type: boolean }
        data_status:
          type: string
          enum: [AVAILABLE, STALE, UNAVAILABLE, NOT_REQUESTED]
        usable: { type: boolean }
        stale: { type: boolean }
    IndexCoverage:
      type: object
      description: >-
        Persisted lazy-index state — served even when no upstream call
        occurred. `provider_status` is an ErrKind, "ok" after a succeeded
        attempt, or null when no attempt is known.
      properties:
        index_status:
          type: string
          enum: [not_indexed, indexing, fresh, partial, failed, disabled]
        stale: { type: boolean }
        provider_status:
          type: ["string", "null"]
          enum: [ok, timeout, rate_limited, degraded, malformed,
                 circuit_open, disabled, not_configured, internal]
        indexed_until_block: { type: ["integer", "null"] }
        indexed_at: { type: ["string", "null"], format: date-time }
        head_block: { type: ["integer", "null"] }
        history_truncated: { type: boolean }
        index_scope: { type: string, enum: ["native+token"] }
        rows_indexed: { type: integer }
        rows_skipped:
          type: object
          properties:
            missing_contract: { type: integer }
            invalid_address: { type: integer }
    TransactionItem:
      type: object
      properties:
        tx_hash: { type: string }
        direction: { type: string, enum: [in, out, self] }
        transfer_type: { type: string, enum: [NATIVE, TOKEN] }
        asset_identifier: { type: ["string", "null"] }
        amount_raw:
          type: string
          description: Raw integer amount (NUMERIC) — never a float.
        counterparty: { type: string }
        block_number: { type: ["integer", "null"] }
        block_timestamp: { type: ["string", "null"], format: date-time }
        confirmation_status: { type: string, enum: [pending, confirmed] }
        is_error: { type: boolean }
        transfer_index: { type: string }
    TransactionPage:
      allOf:
        - $ref: "#/components/schemas/IndexCoverage"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/TransactionItem" }
            next_cursor: { type: string }
    ExposureSignal:
      type: object
      properties:
        kind:
          type: string
          enum: [sanctions_direct, label, listing]
        category: { type: string }
        label: { type: string }
        entity:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        programs:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: ["string", "null"] }
        source: { type: string }
        verification_status: { type: string }
        network: { type: ["string", "null"] }
        listed_address: { type: string }
    ExposureEdge:
      type: object
      properties:
        from_address: { type: string }
        to_address: { type: string }
        network: { type: string }
        tx_hash: { type: string }
        transfer_index: { type: string }
        transfer_type: { type: string, enum: [NATIVE, TOKEN] }
        asset:
          type: string
          description: '"native" for NATIVE rows, else the contract.'
        amount_raw: { type: string }
        block_number: { type: ["integer", "null"] }
        block_timestamp: { type: ["string", "null"], format: date-time }
        confirmation_status: { type: string, enum: [pending, confirmed] }
    ExposurePath:
      type: object
      properties:
        hop_count: { type: integer }
        path_verified:
          type: boolean
          description: Always false in MVP — a path is evidence, never proof.
        temporal_order_valid: { type: boolean }
        edges:
          type: array
          items: { $ref: "#/components/schemas/ExposureEdge" }
    ExposureItem:
      type: object
      properties:
        counterparty: { type: string }
        category: { type: string }
        matched_signals:
          type: array
          items: { $ref: "#/components/schemas/ExposureSignal" }
        relationship:
          type: string
          enum: [direct_counterparty, indirect_hop]
          description: Graph distance only — never ownership.
        hops: { type: integer, enum: [1, 2, 3, 4, 5] }
        exposure_score:
          type: ["integer", "null"]
          minimum: 0
          maximum: 100
          description: >-
            exposure-v1 evidence weight — Σ per-signal base × hop decay ×
            verification × confidence, per-term half-up rounded, capped
            100. `null` when every signal is informational-only.
            Separately versioned from risk scoring; never feeds
            `risk_score`.
        paths:
          type: array
          items: { $ref: "#/components/schemas/ExposurePath" }
        transaction_evidence:
          type: array
          items: { $ref: "#/components/schemas/ExposureEdge" }
    ExposureResult:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ExposureItem" }
        tracing_method: { type: string, enum: [bounded_bfs] }
        exposure_policy_version:
          type: string
          enum: [exposure-v1]
          description: >-
            Version of the per-item `exposure_score` policy — emitted
            always; scores are reproducible by version.
        truncated:
          type: ["string", "null"]
          enum: [deadline, max_provider_requests, max_nodes, max_edges,
                 response_cap, limit]
        coverage:
          type: object
          properties:
            counterparties_total:
              type: integer
              description: Σ |frontier_d| over materialized frontier index {2..max_hops}.
            nodes_examined: { type: integer }
            positions_emitted:
              type: integer
              description: Σ contiguous resolved prefixes across depths.
            nodes_remaining: { type: integer }
            nodes_failed: { type: integer }
            edges_examined: { type: integer }
            provider_calls: { type: integer }
            provider_status: { type: ["string", "null"] }
            sanctions_snapshot_version: { type: ["string", "null"] }
            labels_snapshot_version: { type: ["string", "null"] }
            node_indexed_until:
              type: object
              additionalProperties: { type: ["integer", "null"] }
              description: Attempted positions only.
            head_block: { type: ["integer", "null"] }
            frontier_by_hop:
              type: object
              additionalProperties: { type: integer }
              description: '|frontier_d| keyed by frontier index {2..max_hops}.'
            nodes_examined_by_hop:
              type: object
              additionalProperties: { type: integer }
              description: Attempted positions per frontier index.
            frontier_emitted_by_hop:
              type: object
              additionalProperties: { type: integer }
              description: Contiguous emitted prefix length per frontier index.
            nodes_remaining_by_hop:
              type: object
              additionalProperties: { type: integer }
              description: Positions never attempted per frontier index.
            max_depth_reached:
              type: integer
              description: Deepest frontier index with ≥1 attempt (0 = none).
            root: { $ref: "#/components/schemas/IndexCoverage" }

  responses:
    BadRequest:
      description: Invalid input (unknown network, malformed address, bad id).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: INVALID_ADDRESS, message: "invalid address", request_id: "req_..." }
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: UNAUTHORIZED, message: "valid API key required", request_id: "req_..." }
    Forbidden:
      description: Insufficient role (admin required).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: FORBIDDEN, message: "insufficient role", request_id: "req_..." }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: NOT_FOUND, message: "not found", request_id: "req_..." }
    RateLimited:
      description: Rate limit exceeded; retry after `Retry-After` seconds.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

security:
  - ApiKeyAuth: []
