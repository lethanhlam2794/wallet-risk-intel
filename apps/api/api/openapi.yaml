  /api/v1/screenings:
    post:
      tags: [screenings]
      summary: Run a synchronous risk screening
      description: |
        Executes one screening synchronously: sanctions, labels, and live
        provider inputs are gathered, scored under policy `v1.0.0`, and
        persisted durably before the response is sent.

        **Deliberate deviation from spec §9.6**: the spec's example shows
        `202 Accepted` + `PENDING`. There is no job queue — the pipeline is
        synchronous, so this endpoint returns `201` with the complete §9.7
        result and a `Location` header. `PENDING` exists only as a
        transient idempotency-claim state and is never persisted.

        **Latency**: worst case ≈ the provider fan-out deadline (~25 s)
        plus local lookups. Clients should use a >30 s timeout.

        **Idempotency**: send `Idempotency-Key` to dedupe retries. The key
        is bound to the canonical request (resolved network, normalized
        address, defaulted options) via SHA-256 — same key + different
        payload is always `409 IDEMPOTENCY_CONFLICT`. A same-key,
        same-payload retry while the original is still running polls
        briefly, then either replays the terminal result (`200` +
        `Idempotent-Replay: true`) or returns `409 IDEMPOTENCY_IN_FLIGHT`.
        Without the header every POST creates a new screening.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Dedupe key — 1–255 chars of `[A-Za-z0-9._~-]`. Absent, empty,
            or whitespace-only keys disable idempotency.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: "^[A-Za-z0-9._~-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScreeningRequest" }
            example:
              network: ethereum
              address: "0x098B716B8Aaf21512996dC57EB0615e2383E2f96"
              options:
                include_sanctions: true
                include_labels: true
                include_exposure: true
                max_hops: 2
                refresh_providers: false
      responses:
        "201":
          description: Screening completed and persisted.
          headers:
            Location:
              description: URL of the stored result.
              schema: { type: string, example: "/api/v1/screenings/7d0f6a1e-2b3c-4d5e-8f9a-0b1c2d3e4f5a" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ScreeningResult" }
        "200":
          description: Idempotent replay of an already-completed screening.
          headers:
            Idempotent-Replay:
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ScreeningResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: |
            `IDEMPOTENCY_CONFLICT` — the key was already used with a
            different request payload; `IDEMPOTENCY_IN_FLIGHT` — a
            same-key, same-payload screening is still running past the
            bounded wait.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                conflict:
                  value:
                    error: { code: IDEMPOTENCY_CONFLICT, message: "Idempotency-Key already used with a different request", request_id: "req_..." }
                in_flight:
                  value:
                    error: { code: IDEMPOTENCY_IN_FLIGHT, message: "another screening with this key is still in flight", request_id: "req_..." }

  /api/v1/screenings/{id}:
    get:
      tags: [screenings]
      summary: Fetch a stored screening result
      description: |
        Returns the persisted §9.7 result byte-identically — results are
        stored as type `json` and replay verbatim. Any reader may fetch
        any result UUID (results are not client-private).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stored screening result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ScreeningResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/ingestion-runs:
    post:
      tags: [admin]
      summary: Trigger an ingestion run (async)
      description: |
        Starts a snapshot ingestion for the given source. Exactly one run
        per source may be in flight: a second trigger while one runs
        returns `409 INGESTION_RUNNING`. The run executes asynchronously;
        poll `GET /api/v1/admin/ingestion-runs/{id}` for status.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string, example: ofac_sdn }
            example: { source: ofac_sdn }
      responses:
        "202":
          description: Run accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      run_id: { type: string, format: uuid }
                      status: { type: string, enum: [RUNNING] }
                      source: { type: string }
              example:
                data:
                  run_id: "7d0f6a1e-2b3c-4d5e-8f9a-0b1c2d3e4f5a"
                  status: RUNNING
                  source: ofac_sdn
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An ingestion run is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: INGESTION_RUNNING, message: "an ingestion run is already in progress", request_id: "req_..." }

  /api/v1/admin/ingestion-runs/{id}:
    get:
      tags: [admin]
